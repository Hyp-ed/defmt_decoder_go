name: Publish

on:
  push:
    branches: 
      - release/v*

jobs:
  build_and_test:
    name: Build with all the static libs and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "ubuntu-26.04-arm", "windows-latest"]

    steps:
      - uses: actions/checkout@v7

      - uses: "actions/setup-go@v5"
        with: 
          go-version-file: "go.mod"
          cache-dependency-path: go.mod
          
    
  publish:
    name: "Publish to GO"
    runs-on: "ubuntu-latest"
    needs: ["build"]

    
